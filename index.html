<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="cactus_spike1">
  <title>cactus_spike1</title>
  <style>
    :root {
      --bg: #07120a;
      --card: #0b1a12;
      --muted: #9bb79a;
      --accent: #2ecc71;
      --accent-2: #1fa65a;
      --glass: rgba(255, 255, 255, 0.03);
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #04120a 0%, #072214 100%);
      color: #e8f7ee;
      font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
      padding: 28px;
    }

    .wrap {
      width: 100%;
      max-width: 820px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 18px;
      align-items: start;
    }

    .left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--glass);
      background: linear-gradient(135deg, #062014, #0b2a1a);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .name {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.6px
    }

    .tag {
      color: var(--muted);
      font-size: 13px
    }

    .project {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #04210b;
      font-weight: 800;
      letter-spacing: 0.6px;
      user-select: none;
      display: inline-block;
    }

    .section {
      background: var(--card);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      margin-bottom: 12px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px
    }

    .japan {
      font-weight: 700;
      font-size: 15px;
      margin-top: 6px;
      color: #dff6e6
    }

    .grid-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .link {
      color: #e8f7ee;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.02);
      font-size: 14px;
    }

    .box-title {
      font-weight: 700;
      color: #dff6e6;
      margin-bottom: 8px
    }

    .donate-box {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .donate {
      padding: 8px 12px;
      border-radius: 8px;
      background: linear-gradient(90deg, #123b24, #0b2a18);
      border: 1px solid rgba(255, 255, 255, 0.02);
      color: #dff6e6;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px
    }

    .socials {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .mypc {
      padding: 12px;
      border-radius: 10px;
      background: linear-gradient(90deg, #0b2416, #062014);
      border: 1px solid rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mypc .line {
      font-family: monospace;
      color: #bfe9c9;
      font-size: 13px
    }

    .bytes {
      background: #062214;
      padding: 10px;
      border-radius: 8px;
      color: #bfe9c9;
      font-family: monospace;
      font-size: 13px;
      overflow: auto;
    }

    /* компактный мод-блок внутри профиля убран по запросу */
    /* плавающая кнопка байтов для модераторов (вне профиля) */
    .mod-float {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      z-index: 1200;
    }

    .mod-chip {
      background: linear-gradient(90deg, #0f2b18, #08321b);
      color: #bfe9c9;
      padding: 8px 12px;
      border-radius: 999px;
      font-family: monospace;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      user-select: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }

    /* модальное окно для показа фото */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1300;
    }

    .modal {
      max-width: 90vm;
      max-height: 90vm;
      border-radius: 10px;
      overflow: hidden;
      background: #07120a;
      padding: 0px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal img {

      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 6px
    }

    .modal-close {
      position: absolute;
      right: 22px;
      top: 18px;
      background: rgba(0, 0, 0, 0.5);
      color: #dff6e6;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      z-index: 1400;
    }

    footer {
      grid-column: 1/-1;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px
    }

    @media(max-width:720px) {
      .wrap {
        grid-template-columns: 1fr;
        gap: 12px
      }

      .left {
        flex-direction: row;
        align-items: flex-start
      }

      .avatar {
        width: 96px;
        height: 96px
      }

      .mod-float {
        right: 12px;
        bottom: 12px
      }
    }
  </style>
</head>

<body>
  <main class="wrap" role="main">
    <div class="left">
      <div class="avatar" title="avatar.png">
        <img src="avatar.png" alt="avatar" id="avatar" />
      </div>
      <div class="name">cactus_spike1</div>
      <div class="tag">@cactus_spike1</div>

      <div class="section" style="width:100%;text-align:center">
        <div class="project">SURVIVE OR DIE</div>
      </div>

      <div class="section">
        <div class="box-title">Донаты</div>
        <div class="donate-box">
          <a class="donate" href="https://ko-fi.com/cactus_spike1" target="_blank" rel="noopener">Ko‑fi</a>
          <a class="donate" href="https://boosty.to/cactus_spike1" target="_blank" rel="noopener">Boosty</a>
        </div>
      </div>
    </div>

    <div>
      <div class="section">
        <div class="box-title">Мой ПК</div>
        <div class="mypc">
          <div class="line"><a href="https://cactus-spike1.github.io/MyPC/" class="link" target="_blank"
              rel="noopener">открыть</a></div>

        </div>
      </div>

      <div class="section">
        <div class="box-title">Социальные</div>
        <div class="socials" style="align-items:center">
          <a class="link" href="https://steamcommunity.com/id/cactus_spike1" target="_blank" rel="noopener">Steam</a>

          <!-- Discord: показываем ник и оставляем приглашение -->
          <div style="display:flex;align-items:center;gap:8px;">

            <!-- Явный ник для поиска -->
            <div
              style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.02);padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.02);font-family:monospace;">
              <div style="color:#9bb79a;font-size:13px">Discord:</div>
              <span id="discordTag" style="color:#dff6e6;font-weight:700">prowerplayer</span>
              <button id="copyDiscord"
                style="background:linear-gradient(90deg,#163b28,#0f2b18);color:#dff6e6;border:none;border-radius:8px;cursor:pointer;font-weight:700">Copy</button>
            </div>
          </div>

          <a class="link" href="https://github.com/cactus-spike1" target="_blank" rel="noopener">GitHub</a>
        </div>


      </div>

      <script>
        // Замените строку ниже на ваш реальный Discord‑тег
        const discordTagEl = document.getElementById('discordTag');

        discordTagEl.textContent = 'prowerplayer';

        const copyBtn = document.getElementById('copyDiscord');
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(discordTagEl.textContent);
            copyBtn.textContent = 'Copied';
            setTimeout(() => copyBtn.textContent = 'Copy', 1200);
          } catch (e) {
            // fallback
            const input = document.createElement('input');
            input.value = discordTagEl.textContent;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            copyBtn.textContent = 'Copied';
            setTimeout(() => copyBtn.textContent = 'Copy', 1200);
          }
        });
      </script>


      <div class="section">
        <div class="box-title">О себе</div>
        <div class="japan">私は日本語が好きです</div>
      </div>

      <div class="section">
        <div class="box-title">Заметка</div>
        <div class="bytes">https://mylove.me/ HTTP/1.0 404 Not Found</div>
      </div>
    </div>
  </main>

  <!-- плавающая байт‑кнопка вне профиля (модераторы могут нажать) -->
  <div class="mod-float" aria-hidden="false">
    <!-- hex-строка видна, но находится вне основного профиля -->
    <div class="mod-chip" id="modChip">50 52 49 56 41 54 45</div>
  </div>

  <!-- модальное окно (показывает фото при клике на байт) -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">✕</button>
    <div class="modal" role="document">

      <img src="" alt="image" id="modalImage" />
    </div>
  </div>

  <script>
    // лёгкая пульсация проекта при клике
    document.querySelector('.project').addEventListener('click', e => {
      e.currentTarget.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.03)' }, { transform: 'scale(1)' }], { duration: 420 });
    });

    // поведение плавающей байт-кнопки: при клике открывает модальное с фото
    const modChip = document.getElementById('modChip');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalClose = document.getElementById('modalClose');

    modChip.addEventListener('click', () => {
      // показать модальное
      modalBackdrop.style.display = 'flex';
      modalBackdrop.setAttribute('aria-hidden', 'false');
    });

    modalClose.addEventListener('click', () => {
      modalBackdrop.style.display = 'none';
      modalBackdrop.setAttribute('aria-hidden', 'true');
    });

    // закрытие по клику вне модального содержимого
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) {
        modalBackdrop.style.display = 'none';
        modalBackdrop.setAttribute('aria-hidden', 'true');
      }
    });

    // клавиша Escape закрывает модальное
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalBackdrop.style.display === 'flex') {
        modalBackdrop.style.display = 'none';
        modalBackdrop.setAttribute('aria-hidden', 'true');
      }
    });

    document.getElementById('avatar').src = 'https://cdn.discordapp.com/avatars/1375491268385312830/16dfd688106e5887fe5140193edbcdfd.png?size=2048';
    document.getElementById('modalImage').src = 'https://images.meme-arsenal.com/f17c6b0c5cfd41290ab3c8efcc7489ac.jpg';
  </script>
</body>

</html>
